name: WEGO 죽은 링크 정리 (매일)

# 원래 collect.yml 안에 2시간마다 끼어 있었다. 그런데 이 라우트 하나가
# Vercel 함수 300초 한도에 걸려 exit 22로 죽으면서 수집 워크플로 전체를
# 실패로 만들고 실패 메일을 보냈다(2026-08-02~03에만 4회).
# 성공한 실행도 4분 57초 — 한도까지 3초 남는 수준이라 언제든 다시 넘친다.
#
# 죽은 링크 정리는 2시간마다 할 이유가 없다. 하루 1회로 떼어내면
#   · 수집(하루 12회)이 이 건으로 실패하지 않는다
#   · 실패 확률과 메일이 1/12로 준다
#   · 넘쳐서 실패해도 그날 정리만 밀릴 뿐 수집 데이터는 멀쩡하다
on:
  schedule:
    - cron: '10 17 * * *' # UTC 17:10 = KST 02:10
      # 수집(매시 :17, 2시간마다)과 백업(UTC 18:40) 사이 빈 시간대.
      # 정리가 5분 넘게 걸려도 백업 시작까지 90분 여유가 있다.
  workflow_dispatch: {} # 수동 실행 버튼용

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: prune-dead-links
        # 한 번 실패하면 2분 쉬고 한 번 더 시도한다.
        # 300초 한도에 걸리는 건 그날 링크 수·응답 속도에 좌우되는 경계선 문제라
        # 재시도로 넘어가는 경우가 많다. 두 번 다 실패해야 진짜 문제로 본다.
        # --max-time 320: 서버가 300초에 죽으므로 클라이언트가 먼저 끊지 않게 여유를 준다.
        run: |
          set -u
          URL="https://jeju-wego.vercel.app/api/cron/prune-dead-links?secret=${{ secrets.ADMIN_SECRET }}"
          for attempt in 1 2; do
            echo "── 시도 $attempt ──"
            START=$(date +%s)
            # `if curl ...; then ... fi` 뒤의 $? 는 curl이 아니라 if 문 자체의 값(0)이다.
            # `|| CODE=$?` 로 받아야 실제 curl 코드가 잡히고, bash -e 에도 안 걸린다.
            CODE=0
            curl -sf --max-time 320 "$URL" || CODE=$?
            ELAPSED=$(($(date +%s) - START))
            if [ "$CODE" -eq 0 ]; then
              echo ""
              echo "성공 (${ELAPSED}초)"
              exit 0
            fi
            echo "실패 (curl exit $CODE, ${ELAPSED}초)"
            # `[ ... ] && sleep` 로 쓰면 2회차에서 [ ]가 거짓 → 줄 전체가 1을 반환하고
            # GitHub 기본 셸(bash -e)이 여기서 스크립트를 끊어 마지막 안내가 안 찍힌다.
            if [ "$attempt" = "1" ]; then sleep 120; fi
          done
          echo "두 번 다 실패했다. 정리할 링크가 300초 안에 안 끝나는 양이 됐는지 확인할 것."
          exit 1
